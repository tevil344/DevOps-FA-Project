apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cropleaf
  namespace: cropleaf
spec:
  ingressClassName: nginx
  rules:
    - host: cropleaf.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
