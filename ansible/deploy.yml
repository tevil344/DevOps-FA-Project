---
- name: Configure and deploy CropLeaf
  hosts: cropleaf
  become: true
  vars:
    docker_apt_arch: amd64
  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, git]
        update_cache: true
        state: present

    - name: Add Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true
        state: present

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Check out the approved application revision
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_version }}"
        force: true
      notify: Restart CropLeaf

    - name: Add deployment environment file with protected permissions
      ansible.builtin.template:
        src: cropleaf.env.j2
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart CropLeaf

    - name: Start CropLeaf now
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always

    - name: Verify deployed application readiness
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health/
        status_code: 200
        return_content: true
      register: health
      retries: 12
      delay: 10
      until: health.status == 200

  handlers:
    - name: Restart CropLeaf
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: restarted
